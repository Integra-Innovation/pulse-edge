name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      version:
        description: Version to stamp on built artifacts (blank = dev placeholder)
        type: string
        default: ''

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build, test, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore
        run: dotnet restore Pulse.Edge.slnx --locked-mode

      - name: Build
        run: dotnet build Pulse.Edge.slnx --no-restore --warnaserror

      - name: Test
        run: dotnet test src/Pulse.Edge.Tests/Pulse.Edge.Tests.csproj --no-build --no-restore --logger "trx;LogFileName=pulse-edge-tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: error
          retention-days: 14

      - name: Audit NuGet dependencies
        shell: bash
        run: |
          set -o pipefail
          dotnet list Pulse.Edge.slnx package --vulnerable --include-transitive | tee nuget-vulnerabilities.txt
          ! grep -q "has the following vulnerable packages" nuget-vulnerabilities.txt

      - name: Upload dependency audit
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nuget-vulnerability-audit
          path: nuget-vulnerabilities.txt
          if-no-files-found: error
          retention-days: 14

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint:ui

      - name: Build
        run: pnpm build:ui

      - name: Unit tests
        run: pnpm test:ui

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Enforce frontend license policy
        shell: bash
        run: |
          pnpm licenses list --prod --json > frontend-licenses.json
          if grep -Eiq '\"(AGPL|GPL|LGPL)(-|\")' frontend-licenses.json; then
            echo "Disallowed copyleft production license detected."
            exit 1
          fi

      - name: Upload frontend audit evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: frontend-license-audit
          path: frontend-licenses.json
          if-no-files-found: error
          retention-days: 14

  # The free gitleaks CLI (gitleaks-action@v2 needs a paid license on organization repos).
  # Keep the name "Secret scan": main's branch protection requires that check.
  # Coverage is the same as the action's: a PR's own commits, a push's new commits.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz. Bump both together; the install step also
      # checks this value against the release's own checksums file.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Check out full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          sums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSL --retry 3 -o "$tarball" "$base/$tarball"
          curl -fsSL --retry 3 -o "$sums" "$base/$sums"
          # The release's checksums file must list exactly the pinned hash for this tarball...
          grep -qxF "${GITLEAKS_SHA256}  ${tarball}" "$sums" \
            || { echo "::error::pinned GITLEAKS_SHA256 does not match the release checksums file"; exit 1; }
          # ...and the downloaded bytes must hash to it.
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          mkdir -p bin
          tar -xzf "$tarball" -C bin gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Scan new commits
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gitleaks version
          zero=0000000000000000000000000000000000000000
          if [ "$EVENT" = "pull_request" ]; then
            range="${PR_BASE}..${PR_HEAD}"
          elif [ "$EVENT" = "push" ] && [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "$zero" ]; then
            if git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
              range="${PUSH_BEFORE}..${SHA}"
            else
              echo "::warning::previous head ${PUSH_BEFORE} is not in history; scanning the pushed head commit only"
              range="${SHA}^..${SHA}"
            fi
          else
            # e.g. a release tag push through workflow_call: no new commits, as with the action.
            echo "No new commits to scan for this ${EVENT} event."
            exit 0
          fi
          echo "Scanning ${range}"
          # Findings fail the job (exit 1); secret values are redacted from the log. A repo-root
          # .gitleaks.toml / .gitleaksignore, if one is ever added, is picked up automatically.
          gitleaks git --redact --no-banner --exit-code 1 --log-opts="--no-merges --first-parent ${range}" .

  artifacts:
    name: Versioned artifacts and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Build versioned artifacts
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$INPUT_VERSION"
          if [ -z "$version" ]; then version="0.0.0-${GITHUB_SHA::12}"; fi
          numeric="${version%%-*}"
          mkdir -p artifacts/agent artifacts/ui
          dotnet restore Pulse.Edge.slnx --locked-mode
          dotnet publish src/Pulse.Edge.Agent/Pulse.Edge.Agent.csproj --no-restore --configuration Release --output artifacts/agent -p:Version="$numeric" -p:InformationalVersion="$version"
          pnpm install --frozen-lockfile
          pnpm build:ui
          cp -R src/Pulse.Edge.UI/dist/. artifacts/ui/
          printf 'version=%s\ncommit=%s\nbuild_date=%s\nrun=%s\n' "$version" "$GITHUB_SHA" "$(date -u +%FT%TZ)" "$GITHUB_RUN_ID" > artifacts/build-metadata.txt

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: artifacts
          format: spdx-json
          output-file: artifacts/pulse-edge.spdx.json
          artifact-name: pulse-edge-sbom.spdx.json
          upload-release-assets: false

      - name: Generate checksums
        run: find artifacts -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > artifacts/SHA256SUMS

      - name: Upload checksummed artifacts
        uses: actions/upload-artifact@v6
        with:
          name: pulse-edge-${{ github.sha }}
          path: artifacts
          if-no-files-found: error
          retention-days: 30
